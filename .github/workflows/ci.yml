# .github/workflows/ci.yml
name: TopoTime-Diffusion CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-style:
    name: Code Quality (PEP 8 / PEP 257)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pydocstyle

      - name: Lint with flake8 (PEP 8)
        run: |
          # Контроль синтаксиса и критических ошибок компиляции
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Контроль лимита ширины строк (строго 79 символов по канонам)
          flake8 . --count --max-line-length=79 --statistics

      - name: Check Docstrings (PEP 257)
        run: |
          pydocstyle src/

  docker-build-and-test:
    name: Container Build & Pytest QA
    needs: lint-and-style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (BuildKit caching)
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          # Проверяем, что послойный кэш зависимостей собирается без конфликтов
          docker compose build

      - name: Run Pytest Suite inside Container
        run: |
          # Выполняем 6 разработанных тестов в изолированном окружении
          docker compose run --rm topotime_pipeline pytest tests/
