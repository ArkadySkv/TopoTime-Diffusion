defaults:
  - _self_

# Параметры MLOps инфраструктуры (girafe-ai паттерны)
project_name: "TopoTime-Diffusion"
experiment_name: "sars_cov2_spike_generation"

# Шаг 1: Параметры ЦОС и загрузчика данных
dataloader:
  fs: 1.0
  cutoff_idx: 4

# Шаг 2: Параметры топологического анализа (giotto-tda)
topological_analyzer:
  max_edge_length: 12.0
  homologies: [0, 1, 2]

# Шаг 2.5: Параметры прогнозирования кинетики белка (TimesFM 3.0)
timesfm:
  context_len: 32
  horizon_len: 16

# Шаг 3: Параметры построения 3D-графов белка (PyTorch Geometric)
graph_builder:
  radius_threshold: 6.0

# Шаг 4: Параметры контролируемой диффузии (Point-E + Guidance)
diffusion:
  d_model: 64
  lambda_topo: 0.05
  denoise_steps: 50

# Шаг 5: Параметры хемоинформационной валидации (RDKit)
validation:
  test_smiles: "CC(=O)NC1=CC=C(C=C1)O" # Тестовое лекарственное соединение
  pocket_indices: [5, 12, 18, 24]       # Индексы атомов активного центра по данным TDA
  search_radius: 8.0

checkpointing:
  dir: "checkpoints"
  filename: "topotime_diffusion_latest.pt"
  save_every_n_steps: 10
  log_artifacts_to_wandb: true

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
